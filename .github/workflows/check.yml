name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No BOM / valid package.json
        run: node scripts/check-no-bom.mjs
      - name: Syntax check
        run: node --check index.js
